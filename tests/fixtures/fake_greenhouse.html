<!doctype html>
<html><head><meta charset="utf-8"><title>Fake Greenhouse application</title></head>
<body>
<h1>Software Engineer - Apply</h1>
<form id="application_form" action="#" onsubmit="event.preventDefault(); document.getElementById('submit_app').setAttribute('data-clicked','true'); return false;">
  <label for="first_name">First Name</label>
  <input id="first_name" name="job_application[first_name]" type="text">
  <label for="last_name">Last Name</label>
  <input id="last_name" name="job_application[last_name]" type="text">
  <label for="email">Email</label>
  <input id="email" name="job_application[email]" type="email">
  <label for="phone">Phone</label>
  <input id="phone" name="job_application[phone]" type="tel">
  <label for="question_linkedin">LinkedIn Profile</label>
  <input id="question_linkedin" name="job_application[answers_attributes][0][text_value]" type="text" placeholder="LinkedIn URL">
  <label for="resume">Resume/CV</label>
  <input id="resume" name="job_application[resume]" type="file">
  <input id="submit_app" type="submit" value="Submit Application" data-clicked="false"
         onclick="this.setAttribute('data-clicked','true');">
  <button id="apply_btn" type="button" data-clicked="false" onclick="this.setAttribute('data-clicked','true');">Apply now</button>
</form>
</body></html>
